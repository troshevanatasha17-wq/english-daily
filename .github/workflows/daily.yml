name: Ежедневное повторение

on:
  schedule:
    - cron: "0 5 * * *"   # 05:00 UTC = 08:00 по Москве
  workflow_dispatch:       # кнопка «Run workflow» для ручного запуска

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установить зависимости
        run: pip install -r requirements.txt

      - name: Собрать страницу дня
        run: python bot/daily.py --build

      - name: Сохранить страницу в репозиторий
        run: |
          git config user.name "english-bot"
          git config user.email "english-bot@users.noreply.github.com"
          git add docs
          git commit -m "Повторение $(TZ=Europe/Moscow date +%F)" || echo "Нет изменений"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Опубликовать на GitHub Pages
        uses: actions/deploy-pages@v4

      - name: Отправить в Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot/daily.py --send
